[project]
name = "branchforge-backend"
version = "0.1.0"
description = "BranchForge backend — run intake and persistence (milestone 1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.2",
    "uvicorn[standard]>=0.52.4",
    "anthropic>=1.4.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx2>=2.12.0",
    "playwright==1.60.0",
]

[tool.uv]
# The backend is run from source (uvicorn app.main:app), not installed as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "docker: needs a running Docker daemon and the built runner image (deselect with -m 'not docker')",
    "browser: drives a real browser with Playwright (deselect with -m 'not browser')",
]
