# Alembic configuration for the BranchForge backend.
#
# Note: sqlalchemy.url is intentionally NOT set here. alembic/env.py reads the
# database URL from application settings (DATABASE_URL) so there is exactly one
# source of truth. To target a different database for a one-off command:
#
#   DATABASE_URL=sqlite:///./scratch.db uv run alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
